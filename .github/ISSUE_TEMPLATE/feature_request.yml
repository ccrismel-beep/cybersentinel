name: Proposer une amélioration
description: Suggérer un outil local ou une amélioration de l’interface
title: "[Idée] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: Quel problème cette amélioration résoudrait-elle ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Décrivez le fonctionnement souhaité.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Vie privée
      options:
        - label: Cette proposition peut fonctionner localement ou explique clairement tout transfert externe.
          required: true
